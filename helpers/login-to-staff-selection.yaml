appId: ${APP_ID}
name: "Suite Setup - Login Once"
tags: [android, setup, staff]
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Email or phone number"
    timeout: 5000
- tapOn:
    id: "login_email_field"
    waitToSettleTimeoutMs: 300
- inputText: ${STORE_EMAIL}
- tapOn:
    id: "login_password_field"
    waitToSettleTimeoutMs: 300
- inputText: ${STORE_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Log in"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: ${STAFF_A}
    timeout: 5000
- assertVisible:
    text: ${STAFF_A}
    label: "Login completed at Staff Selection"
