appId: ${APP_ID}
name: "Store Staff Cannot Access Switch Store - iPhone"
tags: [ios, iphone, authorization, negative, switch-store, staff]
---
- runFlow: ../helpers/login-store-to-staff-selection.yaml
- tapOn: ${STAFF_A}
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
- tapOn: ${STAFF_A_PIN_1}
- tapOn: ${STAFF_A_PIN_2}
- tapOn: ${STAFF_A_PIN_3}
- tapOn: ${STAFF_A_PIN_4}
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn: "Settings"
- swipe:
    direction: UP
    duration: 500
- assertNotVisible:
    text: "Switch store|Switch Store"
    label: "Store staff cannot access Switch Store"
