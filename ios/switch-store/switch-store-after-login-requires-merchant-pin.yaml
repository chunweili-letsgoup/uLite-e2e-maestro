appId: ${APP_ID}
name: "Switch Store After Login Requires Merchant PIN - iPhone"
tags: [ios, iphone, authorization, negative, switch-store]
---
- runFlow: ../helpers/login-merchant-to-store-selection.yaml
- tapOn: ${STORE_A}
- extendedWaitUntil:
    visible: ${MERCHANT_NAME}
    timeout: 15000
- extendedWaitUntil:
    visible: "Switch store|Switch Store"
    timeout: 15000
- tapOn: "Switch store|Switch Store"
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
- tapOn: ${INVALID_PIN_1}
- tapOn: ${INVALID_PIN_2}
- tapOn: ${INVALID_PIN_3}
- tapOn: ${INVALID_PIN_4}
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
    label: "Invalid Merchant PIN does not open Store Selection"
- tapOn: ${MERCHANT_PIN_1}
- tapOn: ${MERCHANT_PIN_2}
- tapOn: ${MERCHANT_PIN_3}
- tapOn: ${MERCHANT_PIN_4}
- extendedWaitUntil:
    visible: ${STORE_A}
    timeout: 15000
    label: "Correct Merchant PIN opens Store Selection"
- assertVisible:
    text: ${STORE_B}
    label: "Merchant stores are available after verification"
