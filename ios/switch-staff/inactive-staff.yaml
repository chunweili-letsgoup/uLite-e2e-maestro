appId: ${APP_ID}
name: "Inactive Staff Is Hidden Before and After Switch User - iPhone"
tags: [ios, iphone, negative, staff]
---
- runFlow: ../helpers/login-store-to-staff-selection.yaml
- assertVisible:
    text: ${STAFF_A}
    label: "Active Staff A is available initially"
- assertVisible:
    text: ${STAFF_B}
    label: "Active Staff B is available initially"
- assertNotVisible:
    text: ${INACTIVE_STAFF}
    label: "Inactive staff is excluded initially"
- tapOn: ${STAFF_A}
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
- tapOn: ${STAFF_A_PIN_1}
- tapOn: ${STAFF_A_PIN_2}
- tapOn: ${STAFF_A_PIN_3}
- tapOn: ${STAFF_A_PIN_4}
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Switch user|Switch staff|Switch Account"
    direction: DOWN
- tapOn: "Switch user|Switch staff|Switch Account"
- extendedWaitUntil:
    visible: ${STAFF_B}
    timeout: 15000
- assertVisible:
    text: ${STAFF_A}
    label: "Active Staff A remains available during Switch Staff"
- assertNotVisible:
    text: ${INACTIVE_STAFF}
    label: "Inactive staff is excluded during Switch Staff"
