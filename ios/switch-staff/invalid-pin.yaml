appId: ${APP_ID}
name: "Staff Login Rejects an Invalid PIN - iPhone"
tags: [ios, iphone, negative, staff]
---
- runFlow: ../helpers/login-store-to-staff-selection.yaml
- tapOn: ${STAFF_A}
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
- tapOn: ${INVALID_PIN_1}
- tapOn: ${INVALID_PIN_2}
- tapOn: ${INVALID_PIN_3}
- tapOn: ${INVALID_PIN_4}
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
    label: "Invalid PIN does not authenticate Staff A"
- assertNotVisible:
    text: "Settings"
    label: "No staff session is created"
