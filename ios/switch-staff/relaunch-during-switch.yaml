appId: ${APP_ID}
name: "Relaunch During Switch Staff Returns to Staff Selection - iPhone"
tags: [ios, iphone, resilience, staff]
---
- runFlow: ../helpers/open-switch-staff-as-staff-a.yaml
- killApp
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: ${STAFF_A}
    timeout: 15000
    label: "Relaunch from Staff Selection restores a safe state"
- tapOn: ${STAFF_B}
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
- killApp
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: ${STAFF_A}
    timeout: 15000
    label: "Relaunch from Staff B passcode restores Staff Selection"
- assertVisible:
    text: ${STAFF_B}
    label: "Staff B is not activated without its PIN"
