appId: ${APP_ID}
name: "iOS Setup - Merchant Login to Store Selection"
---
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      notifications: deny
- tapOn:
    text: "(Don.t Allow|不允許)"
    optional: true
- extendedWaitUntil:
    visible: "Email (address|or phone number)"
    timeout: 15000
- tapOn:
    text: "Email (address|or phone number)"
    waitToSettleTimeoutMs: 300
- inputText: ${MERCHANT_EMAIL}
- tapOn:
    text: "Password"
    index: 1
    waitToSettleTimeoutMs: 300
- inputText: ${MERCHANT_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Login|Log in"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: ${STORE_A}
    timeout: 15000
    label: "Merchant login routes to Store Selection"
