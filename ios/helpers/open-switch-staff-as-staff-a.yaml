appId: ${APP_ID}
name: "iOS Setup - Open Switch Staff as Staff A"
---
- runFlow: login-store-to-staff-selection.yaml
- tapOn: ${STAFF_A}
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
- tapOn: ${STAFF_A_PIN_1}
- tapOn: ${STAFF_A_PIN_2}
- tapOn: ${STAFF_A_PIN_3}
- tapOn: ${STAFF_A_PIN_4}
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Switch user|Switch staff|Switch Account"
    direction: DOWN
- tapOn: "Switch user|Switch staff|Switch Account"
- extendedWaitUntil:
    visible: ${STAFF_B}
    timeout: 15000
    label: "Switch Staff opens Staff Selection"
