appId: ${APP_ID}
name: "Owner Can Login with Phone Number - iPhone"
tags: [ios, iphone, authentication, phone-login, happy-path, authorization]
---
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      notifications: deny
- tapOn:
    text: "(Don.t Allow|不允許)"
    optional: true
- extendedWaitUntil:
    visible: "Email (address|or phone number)"
    timeout: 15000
- tapOn:
    text: "Email (address|or phone number)"
    waitToSettleTimeoutMs: 300
- inputText: ${OWNER_ROLE_PHONE}
- tapOn:
    text: "Password"
    index: 1
    waitToSettleTimeoutMs: 300
- inputText: ${OWNER_ROLE_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Login|Log in"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: ${STORE_OWNER}
    timeout: 15000
- tapOn: ${STORE_OWNER}
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
- tapOn: ${STORE_OWNER_PIN_1}
- tapOn: ${STORE_OWNER_PIN_2}
- tapOn: ${STORE_OWNER_PIN_3}
- tapOn: ${STORE_OWNER_PIN_4}
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: ${STORE_OWNER}
    timeout: 15000
    label: "Owner logged in with phone number"
