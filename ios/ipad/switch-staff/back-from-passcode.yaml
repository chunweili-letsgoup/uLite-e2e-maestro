appId: ${APP_ID}
name: "Back from Staff B Passcode Returns to Staff Selection - iPad"
tags: [ios, ipad, tablet, edge, staff]
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: "(Don.t Allow|不允許)"
    timeout: 15000
- tapOn:
    point: "41%,53%"
- runFlow: ../helpers/open-switch-staff-as-staff-a.yaml
- tapOn: ${STAFF_B}
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
- tapOn:
    text: "^Back$"
- extendedWaitUntil:
    visible: ${STAFF_A}
    timeout: 15000
    label: "Back returns safely to Staff Selection"
- assertVisible:
    text: ${STAFF_B}
    label: "Staff B is not authenticated"
