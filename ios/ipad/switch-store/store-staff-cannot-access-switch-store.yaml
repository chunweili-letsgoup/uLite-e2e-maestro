appId: ${APP_ID}
name: "Store Staff Settings Do Not Show Switch Store - iPad"
tags: [ios, ipad, tablet, authorization, negative, switch-store, staff]
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: "(Don.t Allow|不允許)"
    timeout: 15000
- tapOn:
    point: "41%,53%"
- runFlow: ../helpers/login-store-to-staff-selection.yaml
- tapOn: ${STAFF_A}
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 15000
- tapOn: ${STAFF_A_PIN_1}
- tapOn: ${STAFF_A_PIN_2}
- tapOn: ${STAFF_A_PIN_3}
- tapOn: ${STAFF_A_PIN_4}
- extendedWaitUntil:
    visible: "Settings|gearshape.fill"
    timeout: 15000
- tapOn: "Settings|gearshape.fill"
- swipe:
    direction: UP
    duration: 500
- assertNotVisible:
    text: "Switch store|Switch Store"
    label: "Store staff cannot access Switch Store"
