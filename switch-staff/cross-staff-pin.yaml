appId: ${APP_ID}
name: "Another Staff Member PIN Is Rejected"
tags: [android, phone, negative, staff]
---
- tapOn:
    text: ${STAFF_B}
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 5000
- tapOn: { text: "${STAFF_A_PIN_1}", retryTapIfNoChange: false, waitToSettleTimeoutMs: 100 }
- tapOn: { text: "${STAFF_A_PIN_2}", retryTapIfNoChange: false, waitToSettleTimeoutMs: 100 }
- tapOn: { text: "${STAFF_A_PIN_3}", retryTapIfNoChange: false, waitToSettleTimeoutMs: 100 }
- tapOn: { text: "${STAFF_A_PIN_4}", retryTapIfNoChange: false, waitToSettleTimeoutMs: 300 }
- extendedWaitUntil:
    visible: "Enter passcode"
    timeout: 5000
    label: "Reject Staff A PIN for Staff B"
- back
- extendedWaitUntil:
    visible: ${STAFF_A}
    timeout: 5000
